<!doctype html>
<html lang="th" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FilmFlow Inventory — Film & Production Equipment Tracker</title>
    <meta name="description" content="A bilingual inventory, SKU tracking, and Google Sheets sync system for film and commercial productions.">
    <meta name="author" content="FilmFlow" />
    <!-- Prevent Chrome/Safari auto-translate: the app is bilingual (TH/EN) and
         a translation proxy changes the origin, breaking Supabase auth and
         producing "Can't open this page" on iOS. The meta tag below only
         stops Chrome's translate bar — Safari's on-device translate ignores
         it and needs the translate="no" attribute on <html> above instead.
         (This exact fix was found and deployed once already in an earlier
         session but was never committed, so it silently regressed — keep
         both together and committed.) -->
    <meta name="google" content="notranslate" />
    <meta http-equiv="Content-Language" content="th,en" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="FilmFlow Inventory">
    <meta property="og:description" content="Bilingual production inventory management with Google Sheets sync, QR scanning, and multi-department tracking.">
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FilmFlow Inventory">
    <meta name="twitter:description" content="Bilingual production inventory management with Google Sheets sync, QR scanning, and multi-department tracking.">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
